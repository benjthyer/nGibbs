  max_N: null # none, 0 and inf all mean 'no limit'
  DictFilePath: 102CrNoBulk
  loss_config:
    binary:
      weight: 1
    chemistry:
      type: symmetric_rel_l2
      weight: 100
    moles:
      type: huber
      weight: 5E-2
    bulk:
      type: symmetric_rel_l2
      weight: 0
  which_heads_to_freeze: [] # ['encoder', 'sat_head', 'middleBrain', 'chem_heads'] #['encoder', 'sat_head', 'middleBrain', 'chem_heads']

  
train4: # Increase number for another layer of training
  strategy: finetune # Train encoder and saturation predictor, all else frozen. Upper portion of model not used at all for efficiency
  batch_size: 1024 
  epochs: 50
  learning_rate: 1E-4
  early_stopping_patience: 20
