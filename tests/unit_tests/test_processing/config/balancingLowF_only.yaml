# Test config: isolate liquid-fraction balancing only

dataset:
  MELTSModel: '110'
  Date: 'Feb13'
  Mode: 'BatchCooling'
  subset: false
  use_external: false

  #outname: '110BalancingLowFOnly'

featureNames: # Non-chemical features to include in the dataset
  - 'Pressure(System_main)'
  #- 'Temperature(System_main)'
  - 'S(System_main)' # Isentropic 

preprocessing:
  preprocessed: false
  filter_full_metadata: false
  filter_legal: false
  separate_analcime: true

min_phase_proportion: 0    # Minimum phase proportion (0-1) for a sample to be included in training set. Applied after upsampling.

upsampling:
  enabled: false
  phases: {}

resampling:
  train_bounds:
    - [1, 1]
  test_bounds:
    - [1, 1]

balancing:
  function: balance_lowF

deep_filter:
  oxide_lower_bounds: []
  oxide_upper_bounds: []
  component_upper_bounds: []
  component_lower_bounds: []
  batch_size: 200000
