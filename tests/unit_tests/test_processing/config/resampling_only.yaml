# Test config: isolate dataset resampling only

dataset:
  MELTSModel: '102'
  Date: 'Feb9'
  Mode: 'BatchCooling'
  subset: false
  use_external: false



preprocessing:
  preprocessed: false
  filter_full_metadata: false
  filter_legal: false
  separate_analcime: true

upsampling:
  enabled: false
  phases: {}

min_phase_proportion: 0.03    # Minimum phase proportion (0-1) for a sample to be included in training set. Applied after upsampling.

resampling:
  train_bounds:
    - [1, 1]
    - [0.8, 1]
    - [0.5, 1]
  test_bounds:
    - [1, 1]

balancing:
  function: null

deep_filter:
  oxide_lower_bounds: []
  oxide_upper_bounds: []
  component_upper_bounds: []
  batch_size: 200000
