# Test config: isolate deep_filter only

dataset:
  MELTSModel: '120'
  Date: 'June30SedimentsNoCr'
  Mode: 'BatchCooling'
  subset: true
  use_external: false
#outname: '110DeepFilterOnly'

featureNames: # Non-chemical features to include in the dataset
  - 'Pressure(System_main)'
  #- 'Temperature(System_main)'
  - 'S(System_main)' # Isentropic 

preprocessing:
  preprocessed: false
  filter_full_metadata: false
  filter_legal: false
  separate_analcime: true

min_phase_proportion: 0    # Minimum phase proportion (0-1) for a sample to be included in training set. Applied after upsampling.

upsampling:
  enabled: false
  phases: {}

resampling:
  train_bounds:
    - [1, 1]
  test_bounds:
    - [1, 1]

balancing:
  function: null

deep_filter:
  oxide_lower_bounds:
    - ['k-feldspar', 'K2O', 8]
    - ['clinopyroxene', 'CaO', 7]
    - ['melts-liquid', 'SiO2', 30]
  oxide_upper_bounds:
    - ['k-feldspar', 'CaO', 1]
    - ['plagioclase', 'K2O', 8]
    - ['clinopyroxene', 'TiO2', 6]
    - ['clinopyroxene', 'Al2O3', 8]
    - ['orthopyroxene', 'TiO2', 2]
    - ['orthopyroxene', 'Al2O3', 8]
    - ['orthopyroxene', 'CaO', 4]
    - ['melts-liquid', 'TiO2', 13]
    - ['melts-liquid', 'P2O5', 10]
  component_upper_bounds: [['plagioclase', 'sanidine', 0.1]]
  component_lower_bounds: [['olivine', 'fayalite', 0.1]]
  batch_size: 200000
