lower_model:
  encoderLayerUp: 1
  encoderLayerDown: 0
  middleLayerUp: 0
  middleLayerDown: 0
  low_regularization: none
  high_regularization: none
  activation_leak: 0.05
  lowWD: 0.0
  highWD: 0.0
  noise: 0.0
  description: ""
upper_model:
  encoderLayerUp: 1
  encoderLayerDown: 0
  middleLayerUp: 2
  middleLayerDown: 1
  low_regularization: none
  high_regularization: none
  activation_leak: 0.05
  lowWD: 0.0
  highWD: 0.0
  noise: 0.0
  description: ""
data:
  batch_size: 1024
  num_workers: 0
  pin_memory: true
training:
  epochs: 20
  learning_rate: 0.001
  early_stopping_patience: 2
  loss_config:
    binary:
      weight: 1.0
    chemistry:
      type: symmetric_rel_l2
      weight: 1.0
    moles:
      type: symmetric_rel_l2
      weight: 1.0
    bulk:
      type: symmetric_rel_l2
      weight: 0.0
optuna:
  n_trials: 50
  study_name: "nMELTS_optuna"
  search_space: {}
training_strategy:
  stages:
    - name: lower
      freeze_encoder: false
    - name: upper
      freeze_encoder: true
    - name: finetune
      freeze_encoder: false
