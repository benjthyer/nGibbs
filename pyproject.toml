[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nGibbs"
dynamic = ["version"]
description = "A collection of Super-fast Neural Network Emulators of MELTS, HeFESTo, (and other) Free Energy Softwares for Silicate Multi-component Systems."
authors = [
  { name="Ben J. Thyer" }
]
readme = "README.md"
license = { file="LICENSE" } 
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.20.0",
    "torch>=1.9.0",
    "pandas>=1.3.0",
    "tqdm>=4.67.3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
ngibbs = ["**/*"]

[tool.setuptools.exclude-package-data]
# Keep WSL/Windows "mark of the web" sidecars, stray plot output, and
# regenerated .test() artifacts out of the wheel even though package-data globs
# everything under src/ngibbs.
ngibbs = [
    "**/*.Identifier",
    "**/*:Zone.Identifier",
    "**/plots/**",
    "**/deployment_test/**",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngibbs*"]
exclude = ["builder*"]

[tool.setuptools_scm]
write_to = "src/ngibbs/_version.py"

