name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push CITATION.cff and _version.py updates back

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for setuptools-scm to read tag history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update CITATION.cff version and date
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # strip leading 'v' if present (v0.2.0 -> 0.2.0)
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^version: .*/version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"${DATE}\"/" CITATION.cff

      - name: Install build tools and generate _version.py
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${RELEASE_VERSION}"
          pip install build setuptools-scm 
          python -m setuptools_scm  # writes src/ngibbs/_version.py from git tag

      - name: Commit updated CITATION.cff and _version.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff src/ngibbs/_version.py
          git diff --cached --quiet || git commit -m "chore: update version files for ${{ github.event.release.tag_name }} [skip ci]"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Rebase onto origin/main failed; manual conflict resolution required."
            git rebase --abort
            exit 1
          fi
          git push origin HEAD:main

      - name: Build
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${RELEASE_VERSION}"
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
