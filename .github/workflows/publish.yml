name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for setuptools-scm to read tag history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"  # strip leading 'v' (v0.1.0b3 -> 0.1.0b3)
          pip install build setuptools-scm
          SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION}" python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Update CITATION.cff (best-effort)
        continue-on-error: true
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^version: .*/version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"${DATE}\"/" CITATION.cff
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git diff --cached --quiet || git commit -m "chore: update CITATION.cff for ${VERSION} [skip ci]"
          git push origin HEAD:main
