name: Benchmark gate

# Scores every shipped model in ngibbs.engine.models (validation dataset and
# standard workspace) on CPU and compares against the packaged baselines in
# src/ngibbs/engine/TrainedModels/<family>/benchmark_baseline/cpu/. Fails on any regression,
# missing baseline or errored component.
#
# Called by publish.yml before every PyPI upload; can also be run by hand from
# the Actions tab. Running it by hand with `generate` ticked writes fresh CPU
# baselines on the runner and uploads them as an artifact, for committing to
# src/ngibbs/engine/TrainedModels/*/benchmark_baseline/ if the runner's CPU rounds differently
# from yours.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      generate:
        description: "Generate CPU baselines (uploaded as an artifact) instead of checking"
        type: boolean
        default: false

env:
  # Keep in step with the torch that generated the committed CPU baselines
  # (see src/ngibbs/engine/TrainedModels/*/benchmark_baseline/cpu/benchmark_index.json -> environment).
  TORCH_VERSION: "2.12.1"
  # Shallow checkout has no tags; the version string is irrelevant here.
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -e . matplotlib pytest

      - name: Unit tests (Cr routing, workspace discovery, headers)
        run: pytest -q tests/unit_tests/test_API/test_melts_cr_routing_and_workspace_discovery.py tests/unit_tests/test_API/test_condition_header_aliases.py tests/unit_tests/test_API/test_workspace_layout.py

      - name: Benchmark check
        if: ${{ !inputs.generate }}
        run: python scripts/run_benchmarks.py --device cpu

      - name: Generate CPU baselines
        if: ${{ inputs.generate }}
        run: python scripts/run_benchmarks.py --device cpu --generate

      - name: Upload comparison reports
        if: ${{ always() && !inputs.generate }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: ngibbs_deployment_test/*/benchmark_candidate/
          if-no-files-found: ignore

      - name: Upload generated baselines
        if: ${{ inputs.generate }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baselines-cpu
          path: src/ngibbs/engine/TrainedModels/*/benchmark_baseline/
