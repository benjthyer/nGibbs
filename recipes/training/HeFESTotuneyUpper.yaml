    spinel: 4
    stishovite: 5

tune7:
  #best_loss: 7.45870
  strategy: lower # Train encoder and saturation predictor, all else frozen. Upper portion of model not used at all for efficiency
  sweep: true
  batch_size: 1024 
  epochs: 15
  learning_rate: 5E-4
  early_stopping_patience: 2
  max_N: 5E5
  tune_params: # These go in the specified order
    lowWD: [0, 1e-4, 1e-3, 1e-2]
    noise: [0, 0.1, 0.05, 0.01]

train7: # Increase number for another layer of training
  strategy: lower # Train encoder and saturation predictor, all else frozen. Upper portion of model not used at all for efficiency
  batch_size: 1024 
  epochs: 70
  learning_rate: 5E-4
  early_stopping_patience: 25
  scheduler:
    type: CosineAnnealingLR # Any scheduler in optim.lr_scheduler, e.g. 'CosineAnnealingLR', 'ReduceLROnPlateau', 'CosineAnnealingWarmRestarts'.
    args:
      T_max: 10 # Then args to pass to the scheduler, e.g. factor, patience, T_0, etc. See PyTorch documentation for details.
  binweights:
    akimotoite: 10
    hp-clinopyroxene: 4
    plagioclase: 10
    spinel: 4
    stishovite: 5


