## NO STRUCTURAL TUNING HERE. TRYING TO FORCE MARS MODEL TO IMPROVE


tarname: HeFESTo_Mars_Profiles_NPT_Continuous  # loads <tarname>_Train.tar.gz / _Test.tar.gz
warm_start: None #HeFESTo_Earth_Adiabat_NPS_heavy_train1 #None

model_class: ContinuousModel



######### model (initial values; tune1-tune4 below search around these) ###########
encoderLayerUp: 2
encoderLayerDown: 2
encoderBase: 128
moleLayerUp: 2
moleLayerDown: 1
moleBranchBase: 128
chemBranchBase: 64         # 0 = bare Linear-to-softmax (the original, pre-hidden-layer
                            # chem head); tune1 below searches whether a hidden layer helps
head_order: chem_first     # mole heads see the endmember fractions; 'parallel' to decouple

encoder_regularization: 0.0layernormdropout0.3     # NOT batchnorm -- see note at bottom
mole_regularization: 0.01dropout0.3
activation_leak: 0.05
mole_activation_leak: 0.05            # the leaky branch is what makes phase-out continuous
massbalance_iters: 3
massbalance_tikhonov: 1.0e-6
massbalance_damping: 1.0
lowWD: 0.001
highWD: 0.001
noise: 0.0                 # goes into the value path only; derivative targets see clean x
description: "HeFESTo continuous"

######### data ####################################################################
batch_size: 8192         
ram_threshold_gb: 26
device: cuda

######### shared loss defaults (every episode needs a complete loss_config) #######
loss_config:
  binary:
    weight: 0.002                 # ContinuousModel has no saturation head
  chemistry:
    type: symmetric_rel_l2
    weight: 500
  moles:
    type: huber
    weight: 50
  bulk:
    type: symmetric_rel_l2
    weight: 0                 # OFF through tune1-tune4; train1 switches it on -- see note at top

phase_weights:                 # one weight per phase, applied to binary + mole + chemistry
                                # loss alike (never bulk, which has no per-phase concept) --
                                # carried over from HeFESToTuney.yaml's binweights
  akimotoite: 10
  hp-clinopyroxene: 4
  plagioclase: 10
  spinel: 4
  stishovite: 5



tune2: # hyperparameters: initial dropout, WD, noise. inherits tune1's winning geometry.
  strategy: full
  which_heads_to_freeze: ['mole_head']
  sweep: true
  inherit_loss: true
  epochs: 8
  max_N: 3.0e6
  early_stopping_patience: 6
  scheduler:
    type: OneCycleLR
    args:
      max_lr: 1.0e-3
  loss_config:
    moles:
      weight: 0
    binary:
      weight: 0
  tune_params:
    lowWD: [0, 1.0e-5, 1.0e-4, 1.0e-3]     # encoder's own decay
    highWD: [0, 1.0e-5, 1.0e-4, 1.0e-3]    # chem_heads' own decay
    noise: [0, 0.01, 0.05, 0.1]
    # varies the FIRST number (initial dropout rate); ceiling fixed at 0.3 so the
    # adaptive mechanism has room to move during later full training.
    # encoder_regularization: [0.01layernormdropout0.3, 0.01dropout0.3]


####################################################################################
# PHASE B: mole branches (mole_head).
# mole_head is ALWAYS weight_decay=0 in create_optimizer regardless of lowWD/highWD
# (it's hard-routed to the no-decay group, same as every bias and norm layer) -- so
# lowWD/highWD are left OUT of tune4's hyperparameter sweep on purpose, not by
# oversight: they would have no effect on the only thing being trained this phase,
# and encoder/chem_heads (which they DO affect) are frozen throughout it.
####################################################################################

tune4: # hyperparameters: initial dropout, noise (no WD -- see note above).
  strategy: full
  which_heads_to_freeze: ['encoder', 'chem_heads']
  sweep: true
  inherit_loss: true
  epochs: 8
  max_N: 3.0e6
  early_stopping_patience: 6
  scheduler:
    type: OneCycleLR
    args:
      max_lr: 1.0e-3
      epochs: 8
  loss_config:
    chemistry:
      weight: 0
  tune_params:
    noise: [0, 0.01, 0.05, 0.1]
    # mole_regularization: [0.01layernormdropout0.3, 0.01dropout0.3]

####################################################################################
# Joint training: everything unfrozen together. tune1-4 already left the model in a
# decent state ("rapidly trains a solid network"), so this is a real (long,
# early-stopped) run rather than another short diagnostic. This is also where the bulk
# (pre-projection mass-balance residual) term switches on -- the mole branches now
# exist, so `normalize(n_raw @ compToEl)` is a meaningful quantity. _upper_loss puts it
# on the same 1E4 * weight footing as chemistry/moles and only adds it when weight != 0,
# so it stays inert everywhere it is left at 0.
####################################################################################

train1:
  strategy: full
  which_heads_to_freeze: []
  epochs: 120
  learning_rate: 1e-4
  early_stopping_patience: 25
  max_N: null
  boundary_temperature:
    enabled: true
    a_start: 1.0
    a_end: 5.0e-2
  scheduler:
    type: CosineAnnealingLR
    args:
      T_max: 10


train2:
  strategy: full
  which_heads_to_freeze: []
  epochs: 120
  learning_rate: 1e-4
  early_stopping_patience: 25
  max_N: null
  boundary_temperature:
    enabled: true
    a_start: 5.0e-2
    a_end: 1.0e-4
  scheduler:
    type: CosineAnnealingLR
    args:
      T_max: 10
  loss_config:
    bulk:
      weight: 50
