      chemistry:
        type: symmetric_rel_l2
        weight: 100
      moles:
        type: huber
        weight: 0
      bulk:
        type: symmetric_rel_l2
        weight: 0
  which_heads_to_freeze: ['encoder', 'sat_head', 'mole_head']
  binweights:
    akimotoite: 10
    hp-clinopyroxene: 4
    plagioclase: 10
    spinel: 4
    stishovite: 5
  

