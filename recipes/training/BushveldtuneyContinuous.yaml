####################################################################################
# Sequential tuning + training for the continuous-saturation model (ContinuousModel),
# adapted from the gated model's sequential recipe (HeFESToTuney.yaml). Two things
# from that old recipe do not carry over, on purpose:
#
#   - No lower/binary-saturation stage. ContinuousModel has no sat_head -- saturation
#     is the continuous n_phi = clamp(leaky(g_phi), min=0) itself, not a separate gate
#     (see head_aliases in NN_continuous.py, which maps 'sat_head'/'prior_sat_head' to
#     None). There is nothing to initialize there.
#   - Bulk loss is OFF for the whole tuning run and only switches on at train1, once the
#     mole branches exist. For ContinuousModel `bulk` is the pre-projection mass-balance
#     residual: normalize(n_raw @ compToEl) vs the bulk slice of the input (see
#     ContinuousModel.upper_forward). It penalises how far the raw heads sit from the
#     feasible manifold that MassBalanceProjector then enforces exactly -- a secondary
#     regulariser, not a primary target, so its weight stays well below chemistry/moles.
#     It is meaningless before the mole branches are trained (tune3/tune4), hence train1.
#
# Shape of the recipe: tune the encoder + chem_heads together (chem-first mole heads
# condition on the encoder's output), then tune the mole branches on top of that --
# each in two stages, a fast structural search (sweep: false) followed by a
# hyperparameter sweep (sweep: true) -- then one full joint training run (with the bulk
# residual now active), then a final derivative-supervised refinement pass (the only
# episode with derivatives on).
#
#   python src/builder/training/main.py train \
#       --config recipes/training/HeFESTotuneyContinuous.yaml
####################################################################################

tarname: HeFESTo_Earth_Adiabat_NPS_heavy  # loads <tarname>_Train.tar.gz / _Test.tar.gz
warm_start: HeFESTo_Earth_Adiabat_NPS_heavy_train1 #None

model_class: ContinuousModel

######### model (initial values; tune1-tune4 below search around these) ###########
encoderLayerUp: 2
encoderLayerDown: 1
encoderBase: 64
moleLayerUp: 2
moleLayerDown: 1
moleBranchBase: 32
chemBranchBase: 16          # 0 = bare Linear-to-softmax (the original, pre-hidden-layer
                            # chem head); tune1 below searches whether a hidden layer helps
head_order: chem_first     # mole heads see the endmember fractions; 'parallel' to decouple
# Every regularization spec below carries 'dropout' with BOTH numbers at 0.0.
# NN_continuous.py's ContinuousModel._reg only adds an nn.Dropout layer AT ALL when
# the string contains 'dropout' -- so this wires dropout into the network graph from
# the start, just inert (rate 0). pull_number_range reads the FIRST number as the
# initial dropout rate and the LAST as the adaptive ceiling, so tune2/tune4 can raise
# the initial rate later (their hyperparameter stage) without changing any layer
# shapes, and the adaptive dropout_step_up/down machinery in trainer.py/sobolev.py has
# room to move within [initial, ceiling] during training.
encoder_regularization: 0.0dropout0.1     # NOT batchnorm -- see note at bottom
mole_regularization: 0.0dropout0.1
activation_leak: 0.05
mole_activation_leak: 0.05            # the leaky branch is what makes phase-out continuous
massbalance_iters: 3
massbalance_tikhonov: 1.0e-6
massbalance_damping: 1.0
lowWD: 0
highWD: 0
noise: 0.0                 # goes into the value path only; derivative targets see clean x
description: "HeFESTo continuous"

######### data ####################################################################
batch_size: 8192         
ram_threshold_gb: 26
device: cuda

######### shared loss defaults (every episode needs a complete loss_config) #######
loss_config:
  binary:
    weight: 0.002                 # ContinuousModel has no saturation head
  chemistry:
    type: symmetric_rel_l2
    weight: 500
  moles:
    type: huber
    weight: 50
  bulk:
    type: symmetric_rel_l2
    weight: 0                 # OFF through tune1-tune4; train1 switches it on -- see note at top

phase_weights:                 # one weight per phase, applied to binary + mole + chemistry
                                # loss alike (never bulk, which has no per-phase concept) --
                                # carried over from HeFESToTuney.yaml's binweights
  akimotoite: 10
  hp-clinopyroxene: 4
  plagioclase: 10
  spinel: 4
  stishovite: 5

####################################################################################
# PHASE A: encoder + chem_heads.
# create_optimizer (optimizer_factory.py) routes weight decay by each parameter's
# top-level module name: encoder -> lowWD, chem_heads -> highWD, mole_head -> always
# 0 regardless of either. So this phase is the only place lowWD/highWD do anything
# for encoder/chem_heads, and mole_head is frozen throughout it anyway.
#
# tune1 also searches chemBranchBase here, not in tune2: it's a structural (width)
# parameter like encoderBase, not a hyperparameter like dropout/WD/noise, and mole_head
# being frozen throughout Phase A means chem_heads' own capacity is being searched
# without any interference from the (not-yet-trained) mole branches.
####################################################################################


train2:
  strategy: full
  which_heads_to_freeze: []
  epochs: 120
  learning_rate: 1e-4
  early_stopping_patience: 25
  max_N: null
  boundary_temperature:
    enabled: true
    a_start: 2.0e-1
    a_end: 1.0e-5
  scheduler:
    type: CosineAnnealingLR
    args:
      T_max: 10
  loss_config:
    bulk:
      weight: 50