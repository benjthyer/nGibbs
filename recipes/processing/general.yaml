# Configuration for MELTS data processing and ML dataset generation
# This file controls all aspects of the process_for_ML() workflow

# ============================================================================
# DATASET SELECTION
# ============================================================================
dataset: #EXPECTED FILENAME: "nMELTS/data/MELTStables/{MELTSModel}/{'MELTS' if MELTSModel in ['102', '110', '120', 'p'] else ''}{MELTSModel}_<Train/Valid>set{Date}{Mode}"
  MELTSModel: '102'          # MELTS model version: '102', '110', '120', 'p'. Affects which directory dataproducts are read from and written to
  Date: 'July9closedCr'               # Date identifier for dataset naming
  Mode: 'BatchCooling'     # Calculation mode: FxCrystCooling, BatchCooling, etc.
  subset: false              # Whether to use subset versions of datasets
  use_external: false        # Whether to use external storage directory (specified in settings.py)

outname: 102Closed_Cr_NPT    # Base name for output folder (without extension). Auto-Generated if blank

performance:
  chunk_size: 400000          # Number of rows to process at once. Larger = faster, but more memory intensive. Adjust based on available RAM.

# ============================================================================
# NON-CHEMICAL FEATURE AND LABEL CONFIGURATION (format: attribute(phase): e.g. 'Pressure(System_main)')
# ============================================================================
featureNames: # Non-chemical features to include in the dataset
  - 'Pressure(System_main)'
  - 'Temperature(System_main)' 
  #- 'logfO2-QFM(System_main)'

  #- 'S(System_main)' # Isentropic 
  

free_outputs: # Non-chemical labels to predict. These are used for training the saturation predictor and as auxiliary outputs for the encoder.
  - 'S(System_main) / mass(System_main)' # Specific entropy (J/g-K)
  #- 'T(K)(System_main)'
  #- 'VS(km/s)(System_main)'
  #- 'VP(km/s)(System_main)'
  #- 'dVdP*10^6(System_main)' # COMPRESSIBILITY
  #- 'dVdT*10^6(System_main)' # THERMAL EXPANSION
  #- 'H(System_main)'
  #- 'viscosity(System_main)' # 
  #- 'Cp(System_main)' #
  #- 'rhos(System_main)' # Solid Density g/cc
  #- 'rhol(System_main)' # Liquid density g/cc
  #- 'logfO2-QFM(System_main)'

# ============================================================================
# PREPROCESSING OPTIONS
# ============================================================================
preprocessing:
  preprocessed: false        # Skip preprocessing if data already preprocessed
  recover_untracked_phases: false  # Recover hornblende + graphite from bulk-comp residual (metadata tokens 'amphibole'/'graphite')
  filter_full_metadata: false # OFF IF ABOVE IS ON. Filter out rows with unrecognised phase annotations in metadata
  filter_legal: false        # Deprecated
  separate_analcime: false   # Separate analcime phase during preprocessing
  separate_feldspar: true    # Separate k-feldspar and plagioclase during preprocessing (Generally do this, MELTS sometimes classifies K-rich feldspar as plagioclase)
  excluded_oxides: []        # Explicitly exclude oxides from indexer basis (e.g., ['H2O', 'NiO'])
  #(Generally do this, Analcime in MELTS has two distinct compositional fields)

min_phase_proportion: 0.02    # Minimum phase proportion (0-1) for a sample to be included in training set. Applied after upsampling.

# ============================================================================
# RARE PHASE UPSAMPLING
# ============================================================================
# Users can add or remove phases by editing the 'phases' section below.
# For each phase, provide 'n_resamples' (number of resampling iterations)
# and 'multiplier_bounds' ([lower, upper] bounds for perturbation).
# Examples of additional phases: alloy-solid, apatite, cristobalite, etc.

# DO NOT DO / BE CAREFUL WITH ISENTROPIC SIMS AND RESAMPLING
upsampling:
  enabled: true              # Enable rare phase upsampling
  phases:
    nepheline:
      n_resamples: 10
      multiplier_bounds: [0.9, 1.1]
    leucite:
      n_resamples: 2
      multiplier_bounds: [0.9, 1.1]
    analcime:
      n_resamples: 3
      multiplier_bounds: [0.9, 1.1]
    olivine:
      n_resamples: 1
      multiplier_bounds: [0.9, 1.1]
    muscovite:
      n_resamples: 3
      multiplier_bounds: [0.9, 1.1]
    biotite:
      n_resamples: 1
      multiplier_bounds: [0.9, 1.1]
    k-feldspar:
      n_resamples: 1
      multiplier_bounds: [0.9, 1.1]
    hornblende:
      n_resamples: 1
      multiplier_bounds: [0.9, 1.1]
    #graphite:
    #  n_resamples: 1
    #  multiplier_bounds: [0.9, 1.1]
    # For test set - tighter bounds (no/ weak resampling suggested, just augmentation)
    # Use same phase names as above with tighter multiplier_bounds
    test_set_phases:
      nepheline:
        n_resamples: 10
        multiplier_bounds: [0.99, 1.01]
      leucite:
        n_resamples: 2
        multiplier_bounds: [0.99, 1.01]
      analcime:
        n_resamples: 3
        multiplier_bounds: [0.99, 1.01]
      olivine:
        n_resamples: 1
        multiplier_bounds: [0.99, 1.01]
      muscovite:
        n_resamples: 3
        multiplier_bounds: [0.99, 1.01]
      biotite:
        n_resamples: 1
        multiplier_bounds: [0.99, 1.01]
      k-feldspar:
        n_resamples: 1
        multiplier_bounds: [0.99, 1.01]
      hornblende:
        n_resamples: 1
        multiplier_bounds: [0.99, 1.01]
      #graphite:
      #  n_resamples: 1
      #  multiplier_bounds: [0.99, 1.01]
# ============================================================================
# RESAMPLING TO DATASETS - Feature/Label Generation
# ============================================================================
resampling:
  # Resampling bounds for training set. These are used to generate random multipliers to phase masses.
  # Intensive properties are constant, but with different phase proportions.
  # Multiple entries = multiple resampled versions of the dataset
  train_bounds:
    - [1, 1]          # Identity
    #- [0.95, 1]        # Shift phase proportions by ~5%
    #- [0.9, 1]        # Shift phase proportions by ~10%
  
  # Resampling bounds for test/validation sets (typically just full dataset)
  test_bounds:
    - [1, 1]          # Identity (no resampling)

# ============================================================================
# PLOTTING
# ============================================================================
plot:
  enabled: True        # If false or missing, plots are not generated

# ============================================================================
# BALANCING FUNCTION
# ============================================================================
balancing:                    # Selectively "culling" dataset to balance liquid fractions
  function: null  #balance_lowF            # Options: null = no balancing applied 
                              # 'balance_lowF' = Weigh all liquid fractions ~equalLy. Removes subsolidus bias  
                              # 'balance_superliquidus' = Favor subliquidus over superliquidus for Frac. Xtal. 
                              # 'balance_geodynamics' = Keep only 10% liq fraction and less. Used for geodynamics
                            
# ============================================================================
# DEEP FILTERING - Oxide and Component Composition Bounds
# ============================================================================
deep_filter:
  enabled: true           # Enable "deep" filtering, which targets .npy data products. Applies compositional bounds to filter out samples with unphysical compositions.
  # Oxide lower bounds: [phase, oxide, minimum_wt%]
  oxide_lower_bounds:
    - ['k-feldspar', 'K2O', 6]
    - ['clinopyroxene', 'CaO', 6]
    - ['melts-liquid', 'SiO2', 30]
  
  # Oxide upper bounds: [phase, oxide, maximum_wt%]
  oxide_upper_bounds:
    - ['k-feldspar', 'CaO', 4] #1
    #- ['plagioclase', 'K2O', 12] #8
    - ['clinopyroxene', 'TiO2', 9] # 6
    - ['clinopyroxene', 'Al2O3', 12] #8
    - ['orthopyroxene', 'TiO2', 5] #2
    - ['orthopyroxene', 'Al2O3', 10] #8
    - ['orthopyroxene', 'CaO', 6] #4
    - ['melts-liquid', 'TiO2', 13]
    - ['melts-liquid', 'P2O5', 10]
  
  # Component upper bounds: [phase, component, maximum_wt%]
  # Example: [['plagioclase', 'sanidine', 0.1]]
  component_upper_bounds: [['plagioclase', 'sanidine', 0.2]] # 0.1

  # Whole-assemblage bulk oxide bounds: oxide: [min_wt%, max_wt%]
  # Example:
  # bulk_oxide_bounds:
  #   SiO2: [35, 80]
  #   MgO: [0, 50]
  bulk_oxide_bounds: {}
  
  # Processing batch size for "deep" filtering, which targets .npy data products. 
  batch_size: 400000
